{% extends "base.html" %}

{% block title %}Редактирование товара{% endblock %}

{% block content %}
<h1>Редактирование товара</h1>

<form method="POST" class="form">
    <div class="form-group">
        <label>Артикул (SKU):</label>
        <input type="text" name="sku" value="{{ product.sku }}" required>
    </div>
    <div class="form-group">
        <label>Название:</label>
        <input type="text" name="name" value="{{ product.name }}" required>
    </div>
    <div class="form-group">
        <label>Категория:</label>
        <input type="text" name="category" value="{{ product.category or '' }}">
    </div>
    <div class="form-group">
        <label>Единица измерения:</label>
        <input type="text" name="unit" value="{{ product.unit }}">
    </div>
    <div class="form-group">
        <label>Минимальный остаток:</label>
        <input type="number" step="0.01" name="min_stock" value="{{ product.min_stock }}">
    </div>
    <div class="form-group">
        <label>Цена:</label>
        <input type="number" step="0.01" name="price" value="{{ product.price }}">
    </div>
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{{ url_for('products') }}" class="btn">Отмена</a>
</form>
{% endblock %}
